<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>

    <div class="container">
        <div class="inner">

            <div class="item">
                <div class="img_block">
                    <img src="1.png" class="product_img">
                </div>
                <div class="header">
                    <span class="name">fries</span><span class="price">10.15 zl</span>
                </div>
                <div>
                    <button class="btn" id="fries">add</button>
                </div>
            </div>

            <div class="item">
                <div class="img_block">
                    <img src="2.png" class="product_img">
                </div>
                <div class="header">
                    <span class="name">burger</span><span class="price">15.01 zl</span>
                </div>
                <div>
                    <button class="btn" id="burger">add</button>
                </div>
            </div>

            <div class="item">
                <div class="img_block">
                    <img src="3.png" class="product_img">
                </div>
                <div class="header">
                    <span class="name">coke</span><span class="price">9.99 zl</span>
                </div>
                <div>
                    <button class="btn" id="coke">add</button>
                </div>
            </div>

            <div class="item">
                <div class="img_block">
                    <img src="4.png" class="product_img">
                </div>
                <div class="header">
                    <span class="name">pizza</span><span class="price">25 zl</span>
                </div>
                <div>
                    <button class="btn" id="pizza">add</button>
                </div>
            </div>

            <div class="item">
                <div class="img_block">
                    <img src="5.png" class="product_img">
                </div>
                <div class="header">
                    <span class="name">hot dog</span><span class="price">13.8 zl</span>
                </div>
                <div>
                    <button class="btn" id="hdog">add</button>
                </div>
            </div>

            <div class="item">
                <div class="img_block">
                    <img src="6.png" class="product_img">
                </div>
                <div class="header">
                    <span class="name">donut</span><span class="price">5.55 zl</span>
                </div>
                <div>
                    <button class="btn" id="donut">add</button>
                </div>
            </div>

        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="script.js"></script>
</body>
</html>
